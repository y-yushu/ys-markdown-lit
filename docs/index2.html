# 台湾海峡

> 台湾海峡，是连接南海与东海的重要海峡，也是亚洲重要的国际航运通道之一。
>
> 本文用于测试 Markdown 渲染效果，因此会包含标题、列表、引用、代码块、表格、图片、公式、Mermaid 等多种内容。

---

## 地理位置

台湾海峡位于中国大陆东南沿海与台湾岛之间，北接东海，南连南海，整体呈南北走向。

### 周边区域

- 西侧：中国大陆沿海
  - 福建省
  - 广东省部分海域
- 东侧：台湾岛西部沿海
- 北部：东海
- 南部：巴士海峡

### 海峡特点

1. 航运繁忙
2. 海域跨度较长
3. 季风影响明显
4. 台风活动频繁

---

## 海峡宽度

台湾海峡平均宽度约为：

| 区域 | 宽度（约） |
|---|---:|
| 最窄处 | 130 km |
| 平均宽度 | 180 km |
| 最宽处 | 220 km |

---

## 气候与洋流

台湾海峡受到季风与洋流共同影响。

### 夏季特点

- 气温较高
- 湿度较大
- 南风明显
- 台风活动增多

### 冬季特点

- 东北季风增强
- 海面风浪较大
- 气温下降明显

---

## 航运价值

台湾海峡是全球重要的国际航运通道之一。

### 主要特点

- 东亚能源运输的重要节点
- 国际货轮通行密集
- 对区域贸易具有重要意义

> 很多国际航线会经过台湾海峡，因此这里长期保持较高的航运密度。

---

## 主要港口

### 中国大陆沿岸港口

- 厦门港
- 福州港
- 泉州港

### 台湾沿岸港口

- 高雄港
- 台中港
- 基隆港

---

## 海洋生态

台湾海峡拥有丰富的海洋生态资源。

### 常见海洋生物

- 金枪鱼
- 鲭鱼
- 海豚
- 珊瑚

### 生态问题

- 过度捕捞
- 海洋污染
- 气候变化影响

---

## 历史与文化

台湾海峡不仅是地理概念，也长期影响两岸文化交流。

### 古代航海

古代沿海居民常通过海峡进行：

- 渔业活动
- 商贸往来
- 人员迁徙

### 民间文化

部分沿海地区拥有相似的：

- 方言
- 饮食文化
- 民俗信仰

## 长文本测试

台湾海峡长期以来都是东亚海上交通的重要组成部分。随着国际贸易的发展，其航运地位进一步提升。大量国际货轮、能源运输船舶以及区域航线都会经过这一海域，因此相关的气象、海洋与航运研究也持续受到关注。

与此同时，台湾海峡周边地区拥有丰富的人文与历史背景。沿海城市之间长期存在贸易与文化交流，使得海峡不仅具有地理意义，也承载了区域发展的历史轨迹。
